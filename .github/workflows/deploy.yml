# Compila el portafolio y lo publica en GitHub Pages en cada push a `main`.
# Requisito único: en el repositorio, Settings → Pages → Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Obtiene la URL pública y la ruta base del sitio:
      #   usuario.github.io            → base "/"
      #   usuario.github.io/portafolio → base "/portafolio/"
      #   dominio propio               → base "/"
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Ajustar URLs absolutas (SEO / Open Graph) y fallback 404
        working-directory: dist/portafolio/browser
        run: |
          sed -i "s#__SITE_URL__#${{ steps.pages.outputs.base_url }}#g" index.html
          cp index.html 404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/portafolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
