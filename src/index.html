    <meta property="og:type" content="profile" />

    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Luis Rendón · Desarrollador Full Stack" />
    <meta
      property="og:description"
      content="Angular, ASP.NET Core, C# y SQL Server. Sistemas web completos, de la interfaz a la base de datos."
    />
    <meta property="og:image" content="__SITE_URL__/img/luis-rendon.jpg" />
    <meta property="profile:first_name" content="Luis Fernando" />

    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Luis Fernando Rendón Medina",
        "jobTitle": "Desarrollador Full Stack",
        "url": "__SITE_URL__/",

          "ASP.NET Core",

          "Azure DevOps"
        ]

    <!-- Aplica el tema guardado antes del primer pintado (evita el destello claro/oscuro). -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

  <body>
    <app-root></app-root>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        Luis Fernando Rendón Medina — Desarrollador Full Stack (Angular, C#, ASP.NET Core, SQL

      </p>
    </noscript>
